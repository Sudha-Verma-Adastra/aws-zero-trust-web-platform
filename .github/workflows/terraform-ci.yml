
name: Terraform CI

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Format and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Terraform files exist
        shell: bash
        run: |
          if ! find terraform -type f -name '*.tf' -print -quit 2>/dev/null | grep -q .; then
            echo "No Terraform files found under terraform/. Add configuration before running validation."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Initialize
        working-directory: terraform/bootstrap/hcp-aws-oidc
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform/bootstrap/hcp-aws-oidc
        run: terraform validate

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
